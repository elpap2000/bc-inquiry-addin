<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BC Inquiry Auth</title>

  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="https://alcdn.msauth.net/browser/3.10.0/js/msal-browser.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .box {
      width: 100%;
      max-width: 420px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.08);
      text-align: center;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid #e2e8f0;
      border-top-color: #0066cc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 13px;
      color: #64748b;
      line-height: 1.45;
    }
    .error {
      margin-top: 12px;
      color: #b91c1c;
      font-size: 12px;
      white-space: pre-wrap;
      text-align: left;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <div class="title">Signing in to Business Central</div>
    <div class="sub">Please wait while the add-in gets a secure token for Inquiry search.</div>
    <div id="error" class="error" style="display:none;"></div>
  </div>

  <script src="app-config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
